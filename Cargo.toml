[package]
name = "mercado-solidario"
version = "1.0.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8", features = ["ssr"] }
axum = { version = "0.8", features = ["form"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
chrono-tz = "0.10"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
csv = "1"
urlencoding = "2"
tower-http = { version = "0.6", features = ["set-header", "limit"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
